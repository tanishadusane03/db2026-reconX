# TICKET-ADV093 / ADV094 — Prometheus alert rules
groups:
  - name: reconx-business
    rules:
      - alert: TooManyReconBreaks
        expr: recon_break_count > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Open recon breaks > 50 for 5 min"
          description: "Current breaks: {{ $value }}"

      - alert: HighApiLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket[5m]))
          ) > 0.5
        for: 3m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "API P95 latency > 500ms for 3 min"
          description: "Current P95 latency value: {{ $value }}"

      - alert: KafkaDlqGrowing
        expr: increase(kafka_consumer_records_consumed_total{topic="trade-events-dlq"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Messages landing in trade-events-dlq"
